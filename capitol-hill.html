    ev.preventDefault();
    const err = document.getElementById("err"); err.textContent = "Unlocking…";
    const raw = await derive(document.getElementById("pw").value);
    try {
      try { localStorage.setItem("ej-key", btoa(String.fromCharCode(...raw))); } catch (e) {}
      await unlock(raw);
    } catch (e) { err.textContent = "Wrong password."; try { localStorage.removeItem("ej-key"); } catch (_) {} }
  });
})();
</script>
