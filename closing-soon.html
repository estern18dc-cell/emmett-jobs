  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const page = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.iv) }, key, b64(DATA.ct));
  document.open(); document.write(new TextDecoder().decode(page)); document.close();
}
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(DATA.salt), iterations: DATA.it }, base, 256));
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem("ej-key"); } catch (e) {}
  if (saved) {
    document.documentElement.style.visibility = "hidden";  // no flash of the lock form on a remembered device
    if (document.readyState === "loading") await new Promise(r => addEventListener("DOMContentLoaded", r));
    await new Promise(r => setTimeout(r));  // document.open() only replaces the page once parsing has finished
    try { await unlock(b64(saved)); return; } catch (e) { try { localStorage.removeItem("ej-key"); } catch (_) {} }
    document.documentElement.style.visibility = "";
  }
  document.getElementById("f").addEventListener("submit", async ev => {
    ev.preventDefault();
    const err = document.getElementById("err"); err.textContent = "Unlocking…";
    const raw = await derive(document.getElementById("pw").value);
    try {
      try { localStorage.setItem("ej-key", btoa(String.fromCharCode(...raw))); } catch (e) {}
      await unlock(raw);
    } catch (e) { err.textContent = "Wrong password."; try { localStorage.removeItem("ej-key"); } catch (_) {} }
  });
})();
